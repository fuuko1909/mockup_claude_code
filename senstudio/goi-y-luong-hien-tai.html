// Ghi chu cho mockup tinh: o ghi chu moi phuong an + ghi chu chung, luu localStorage,
// nut Copy gom lua chon + ghi chu de user dan vao chat cho Claude (trang tinh khong gui ve duoc).
(function () {
  var KEY = 'mockup-notes:' + location.pathname;
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  function save() {
    var d = { _chon: picked() };
    document.querySelectorAll('textarea[data-note]').forEach(function (t) { d[t.dataset.note] = t.value; });
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  }
  function picked() {
    return [].map.call(document.querySelectorAll('.selected[data-choice]'), function (o) { return o.dataset.choice.toUpperCase(); });
  }
  function area(id, ph) {
    var t = document.createElement('textarea');
    t.dataset.note = id; t.placeholder = ph; t.rows = 2; t.value = saved[id] || '';
    t.style.cssText = 'width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid #8b949e66;background:transparent;color:inherit;font:13px system-ui;resize:vertical';
    t.addEventListener('click', function (e) { e.stopPropagation(); }); // khong chon option khi bam vao o ghi chu
    t.addEventListener('input', save);
    return t;
  }
  var status = document.createElement('span');
  function refresh() { var s = picked(); status.textContent = s.length ? 'Đã chọn: ' + s.join(', ') : 'Chưa chọn'; }

  if (!window.toggleSelect) window.toggleSelect = function (el) {
    var c = el.closest('.options') || el.closest('.cards'); var m = c && c.dataset.multiselect !== undefined;
    if (c && !m) c.querySelectorAll('.option, .card').forEach(function (o) { o.classList.remove('selected'); });
    m ? el.classList.toggle('selected') : el.classList.add('selected');
  };
  var orig = window.toggleSelect;
  window.toggleSelect = function (el) { orig(el); refresh(); save(); };

  document.querySelectorAll('[data-choice]').forEach(function (o) {
    var id = o.dataset.choice;
    (o.querySelector('.content, .card-body') || o).appendChild(area(id, 'Ghi chú cho phương án ' + id.toUpperCase() + '…'));
    if ((saved._chon || []).indexOf(id.toUpperCase()) >= 0) o.classList.add('selected');
  });

  var bar = document.createElement('div');
  bar.style.cssText = 'position:sticky;bottom:0;z-index:50;margin-top:24px;padding:12px;border-top:1px solid #8b949e66;background:var(--bg-primary,Canvas);display:flex;flex-direction:column;gap:8px';
  var gen = area('chung', 'Ghi chú chung: muốn đổi gì, thêm gì…');
  gen.style.marginTop = '0';
  var row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:14px system-ui';
  var btn = document.createElement('button');
  btn.textContent = 'Copy để gửi Claude';
  btn.style.cssText = 'padding:8px 16px;border-radius:6px;border:0;background:#2f81f7;color:#fff;font:600 14px system-ui;cursor:pointer';
  btn.onclick = function () {
    var lines = ['Mockup: ' + ((document.querySelector('h1, h2') || {}).textContent || document.title) + ' (' + location.href + ')', 'Chọn: ' + (picked().join(', ') || '(chưa chọn)')];
    document.querySelectorAll('textarea[data-note]').forEach(function (t) {
      if (t.value.trim()) lines.push((t.dataset.note === 'chung' ? 'Ghi chú chung' : 'Ghi chú ' + t.dataset.note.toUpperCase()) + ': ' + t.value.trim());
    });
    var txt = lines.join('\n');
    var done = function () { btn.textContent = 'Đã copy — dán vào chat'; setTimeout(function () { btn.textContent = 'Copy để gửi Claude'; }, 2500); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, function () { prompt('Copy đoạn này:', txt); });
    else prompt('Copy đoạn này:', txt);
  };
  row.appendChild(btn); row.appendChild(status);
  bar.appendChild(gen); bar.appendChild(row);
  (document.getElementById('frame-content') || document.body).appendChild(bar);
  refresh();
})();
</script>
